<main class="aw-body">
<button type="button" class="aw-btn aw-out aw-w aw-lg"><span class="aw-dot aw-r" style="width:8px;height:8px"></span>Start recording</button>
<section class="aw-card aw-cp aw-col" style="gap:10px">
  <label class="aw-lbl" for="imp">Paste or load JSON, cURL, or fetch()</label>
  <textarea id="imp" class="aw-ta" style="height:150px" placeholder="Paste JSON, cURL, or fetch() here…"></textarea>
  <div class="aw-g2" style="gap:8px">
    <button type="button" class="aw-btn aw-pri"><svg class="aw-i aw-i14" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Apply</button>
    <button type="button" class="aw-btn aw-out"><svg class="aw-i aw-i14" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"></path></svg>Choose file</button>
  </div>
</section>
<section class="aw-card aw-cp aw-col" style="gap:10px">
  <div class="aw-h" style="font-size:13px">Supported formats</div>
  <div class="aw-col" style="gap:9px">
    <div class="aw-row aw-xs"><span class="aw-bd aw-gr" style="width:112px;justify-content:center">Native</span><span class="aw-mu">Profile + endpoints JSON</span></div>
    <div class="aw-row aw-xs"><span class="aw-bd aw-bl" style="width:112px;justify-content:center">Swagger / OpenAPI</span><span class="aw-mu">2.0 / 3.0</span></div>
    <div class="aw-row aw-xs"><span class="aw-bd aw-am" style="width:112px;justify-content:center">HAR</span><span class="aw-mu">1.2</span></div>
    <div class="aw-row aw-xs"><span class="aw-bd aw-vi" style="width:112px;justify-content:center">Postman</span><span class="aw-mu">v2.1</span></div>
    <div class="aw-row aw-xs" style="align-items:flex-start"><span class="aw-bd aw-rd" style="width:112px;justify-content:center">Recorder</span><span class="aw-mu" style="text-wrap:pretty">Extension mode captures the whole tab; bookmarklet mode captures this frame</span></div>
    <div class="aw-row aw-xs"><span class="aw-bd" style="width:112px;justify-content:center;color:#e4e4e7">cURL</span><span class="aw-mu">Copy as cURL from DevTools</span></div>
    <div class="aw-row aw-xs"><span class="aw-bd" style="width:112px;justify-content:center;color:#e4e4e7">fetch()</span><span class="aw-mu">Copy as fetch from DevTools</span></div>
  </div>
</section>
